name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Repo secrets required for a signed build: RELEASE_KEYSTORE_BASE64,
      # RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      # Until those exist, this workflow still runs and falls back to a
      # debug-signed build so releases keep working while you set them up.
      - name: Check for release signing secret
        id: signing
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK (no signing secret set yet)
        if: steps.signing.outputs.enabled == 'false'
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename and checksum APK
        id: apk
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NAME="NimkuProxy-${TAG}.apk"
          mkdir -p release
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$SRC" "release/${NAME}"
          sha256sum "release/${NAME}" | awk '{print $1}' > "release/${NAME}.sha256"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ steps.apk.outputs.name }}
            release/${{ steps.apk.outputs.name }}.sha256
          generate_release_notes: true
