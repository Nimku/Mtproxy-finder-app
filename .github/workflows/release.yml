name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v1.0.0 (only used for manual runs)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Repo secrets required for a signed build: RELEASE_KEYSTORE_BASE64,
      # RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      # Until those exist, this workflow still runs and falls back to a
      # debug-signed build so releases keep working while you set them up.
      - name: Check for release signing secret
        id: signing
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK (no signing secret set yet)
        if: steps.signing.outputs.enabled == 'false'
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename and checksum APK
        id: apk
        run: |
          set -euo pipefail
          # Real releases are triggered by pushing a "vX.Y.Z" tag, so GITHUB_REF_NAME
          # is already the right tag. Manual (workflow_dispatch) runs don't have a tag
          # at all, so they use the "version" input instead.
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          NAME="NimkuProxy-${TAG}.apk"
          mkdir -p release
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$SRC" "release/${NAME}"
          sha256sum "release/${NAME}" | awk '{print $1}' > "release/${NAME}.sha256"
          # Byte-identical copy under a version-free name, so
          # /releases/latest/download/NimkuProxy.apk is a permanent one-tap download link
          # (GitHub's /latest/download/ needs an exact filename, and the versioned one
          # changes every release). The name deliberately has NO hyphen after "NimkuProxy":
          # UpdateChecker only accepts assets matching "NimkuProxy-*.apk", so this copy stays
          # invisible to the in-app updater and can't compete with the versioned asset.
          # It also gets no .sha256 companion on purpose — UpdateChecker takes the last
          # "*.apk.sha256" it sees, so a second one could shadow the real digest.
          cp "$SRC" "release/NimkuProxy.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat "release/${NAME}.sha256")" >> "$GITHUB_OUTPUT"

      # A freshly built APK nobody has ever scanned shows up on VirusTotal as an *unknown* file,
      # which reads as more suspicious to a cautious user than a clean report does — that was
      # real feedback from people who refused to install it. Submitting the build here means a
      # report for this exact SHA256 already exists before anyone downloads it, so the link in
      # the release notes always resolves to a genuine scan instead of "file not found".
      #
      # Needs a VIRUSTOTAL_API_KEY repo secret (free key from virustotal.com is enough). Without
      # it the step still publishes the report URL — the digest determines it — and just skips
      # the upload. Nothing here is allowed to fail the release.
      - name: Submit APK to VirusTotal
        id: vt
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -uo pipefail
          NAME="${{ steps.apk.outputs.name }}"
          SHA256=$(cat "release/${NAME}.sha256")
          # The GUI URL is keyed by the file digest, so it is correct whether the upload below
          # succeeds, fails, or is skipped — VirusTotal may already know this file anyway.
          echo "url=https://www.virustotal.com/gui/file/${SHA256}" >> "$GITHUB_OUTPUT"
          echo "summary=" >> "$GITHUB_OUTPUT"

          if [ -z "${VT_API_KEY}" ]; then
            echo "No VIRUSTOTAL_API_KEY secret set — skipping upload, report link still published."
            exit 0
          fi

          ANALYSIS_ID=$(curl -sS -X POST \
            -H "x-apikey: ${VT_API_KEY}" \
            -F "file=@release/${NAME}" \
            https://www.virustotal.com/api/v3/files \
            | jq -r '.data.id // empty')

          if [ -z "${ANALYSIS_ID}" ]; then
            echo "Upload did not return an analysis id — report link still published."
            exit 0
          fi
          echo "Uploaded. Analysis id: ${ANALYSIS_ID}"

          # Scans typically finish in 1-3 minutes. Poll at 30s (well inside the free key's
          # 4 requests/minute limit) and give up quietly rather than holding up the release.
          for _ in $(seq 1 10); do
            sleep 30
            RESP=$(curl -sS -H "x-apikey: ${VT_API_KEY}" \
              "https://www.virustotal.com/api/v3/analyses/${ANALYSIS_ID}")
            if [ "$(echo "${RESP}" | jq -r '.data.attributes.status // empty')" != "completed" ]; then
              continue
            fi
            FLAGGED=$(echo "${RESP}" | jq -r '
              (.data.attributes.stats.malicious // 0) + (.data.attributes.stats.suspicious // 0)')
            TOTAL=$(echo "${RESP}" | jq -r '[.data.attributes.stats[]] | add // 0')
            echo "summary=${FLAGGED} / ${TOTAL} security vendors flagged this file" >> "$GITHUB_OUTPUT"
            echo "Scan complete: ${FLAGGED}/${TOTAL} flagged."
            break
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          files: |
            release/${{ steps.apk.outputs.name }}
            release/${{ steps.apk.outputs.name }}.sha256
            release/NimkuProxy.apk
          generate_release_notes: true
          body: |
            **Nimku Proxy is free.** No subscription, no payment, no account.

            ### Verify this download before installing

            - **VirusTotal report:** ${{ steps.vt.outputs.url }}
              ${{ steps.vt.outputs.summary }}
            - **SHA-256:** `${{ steps.apk.outputs.sha256 }}`

            Confirm the file you downloaded matches:

            ```
            sha256sum ${{ steps.apk.outputs.name }}
            ```

            Or build it yourself from this exact tag and compare — see
            [Verifying and building it yourself](https://github.com/${{ github.repository }}#verifying-and-building-it-yourself).

            Trouble installing? See the
            [install guide](https://github.com/${{ github.repository }}#installing-the-apk),
            including the extra steps Xiaomi/MIUI, Huawei and Samsung phones need.

            ---

      # The in-app updater's primary source is the GitHub Releases API, which is always
      # accurate. update_manifest.json is only a fallback for regions where that API itself
      # is blocked — but a hand-edited fallback silently goes stale (the app has no way to
      # know), so it's regenerated here from this release's real data on every run instead.
      - name: Update fallback update manifest
        run: |
          set -euo pipefail
          TAG="${{ steps.apk.outputs.tag }}"
          NAME="${{ steps.apk.outputs.name }}"
          SHA256=$(cat "release/${NAME}.sha256")
          SIZE=$(stat -c%s "release/${NAME}")
          REPO="${{ github.repository }}"
          cat > update_manifest.json <<JSON
          {
            "version": "${TAG#v}",
            "tag_name": "${TAG}",
            "apk_name": "${NAME}",
            "apk_url": "https://github.com/${REPO}/releases/download/${TAG}/${NAME}",
            "apk_size": ${SIZE},
            "sha256": "${SHA256}",
            "sha256_url": "https://github.com/${REPO}/releases/download/${TAG}/${NAME}.sha256",
            "release_url": "https://github.com/${REPO}/releases/tag/${TAG}",
            "virustotal_url": "https://www.virustotal.com/gui/file/${SHA256}"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update fallback manifest for ${TAG}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
